<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Go</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

<body>
<div id="app">
  <div id="banner" class="wait">Connecting…</div>
  <div id="sub"></div>
  <div id="notice"></div>
  <div id="bowls">
    <div class="bowl" data-c="b"><div class="bhead"><span class="stone b"></span><b>Black</b><span class="hint" id="hintb"></span><span class="cap" id="capb"></span></div><div class="chips" id="chipsb"></div></div>
    <div class="bowl" data-c="w"><div class="bhead"><span class="stone w"></span><b>White</b><span class="hint" id="hintw"></span><span class="cap" id="capw"></span></div><div class="chips" id="chipsw"></div></div>
  </div>
  <div id="watchers"></div>
  <div id="boardwrap"><svg id="board"></svg></div>

</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
firebase.initializeApp({
  apiKey: "AIzaSyDf2aZioehr3Owb9bf4gmRjgRii0i5Ctbc",
  authDomain: "project-0cbb7d36-56e5-441e-8fe.firebaseapp.com",
  databaseURL: "https://project-0cbb7d36-56e5-441e-8fe-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "project-0cbb7d36-56e5-441e-8fe",
  appId: "1:531740406755:web:fe0ee4c37001a9d4e966d6"
});
const DB = firebase.database(), R = DB.ref('go'), TS = firebase.database.ServerValue.TIMESTAMP;
const ls = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
};

// ---------- who am I ----------
const ANIMALS = [['🦊','Fox'],['🐼','Panda'],['🐸','Frog'],['🐯','Tiger'],['🐨','Koala'],['🦉','Owl'],['🐢','Turtle'],['🐧','Penguin'],['🐙','Octopus'],['🦁','Lion'],['🐰','Rabbit'],['🦔','Hedgehog']];
let me = ls.get('goDevice');
if (!me) { me = Math.random().toString(36).slice(2) + Date.now().toString(36); ls.set('goDevice', me); }
const tab = me.slice(0, 20) + '-' + Math.random().toString(36).slice(2, 7);
let myAnimal = ls.get('goAnimal') === null ? -1 : +ls.get('goAnimal');
let myName = ls.get('goName') || '';
let myColour = ls.get('goColour');      // null = never chosen, '' = just watching
let viewing = ls.get('goGame');

const NAME = { b: 'Black', w: 'White' };
const other = c => c === 'b' ? 'w' : 'b';
const coarse = matchMedia('(pointer: coarse)').matches;
const esc = s => String(s).replace(/[&<>"]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]));

// ---------- rules engine ----------
function neighbours(n, p) {
  const x = p % n, y = (p - x) / n, a = [];
  if (x > 0) a.push(p - 1); if (x < n - 1) a.push(p + 1);
  if (y > 0) a.push(p - n); if (y < n - 1) a.push(p + n);
  return a;
}
function group(n, board, p) {
  const c = board[p], stones = [p], seen = new Set([p]), libs = new Set();
  for (let i = 0; i < stones.length; i++) for (const q of neighbours(n, stones[i])) {
    if (board[q] === '') libs.add(q);
    else if (board[q] === c && !seen.has(q)) { seen.add(q); stones.push(q); }
  }
  return { stones, libs: libs.size };
}
// {board, captured} or null if illegal (reason in play.why)
function play(n, board, prev, c, p) {
  if (board[p] !== '') { play.why = 'There is already a stone there.'; return null; }
  const nb = board.slice(); nb[p] = c; let captured = 0;
  for (const q of neighbours(n, p)) if (nb[q] === other(c)) {
    const g = group(n, nb, q);
    if (g.libs === 0) { for (const s of g.stones) nb[s] = ''; captured += g.stones.length; }
  }
  if (group(n, nb, p).libs === 0) { play.why = 'You can’t play there – the stone would have no liberties.'; return null; }
  if (prev && nb.every((v, i) => v === prev[i])) { play.why = 'Ko: play somewhere else first before taking back.'; return null; }
  return { board: nb, captured };
}
const toArr = m => (Array.isArray(m) ? m : m ? Object.values(m) : []).filter(Boolean);
function replay(g) {
  const n = g.size; let board = new Array(n * n).fill(''), prev = null; const caps = { b: 0, w: 0 };
  for (const m of toArr(g.moves)) {
    if (m.p < 0) { prev = board; continue; }
    const r = play(n, board, prev, m.c, m.p);
    if (!r) continue;
    prev = board; board = r.board; caps[m.c] += r.captured;
  }
  return { board, caps, prev };
}

// ---------- territory estimate: Monte Carlo ownership in a worker ----------
const WORKER = `
let cur = 0;
onmessage = e => { cur = e.data.id; start(e.data); };
function start(J) {
  const n = J.size, N = n * n, id = J.id, total = J.total;
  const nb = [], dg = [];
  for (let p = 0; p < N; p++) {
    const x = p % n, y = (p - x) / n, a = [], d = [];
    if (x > 0) a.push(p - 1); if (x < n - 1) a.push(p + 1); if (y > 0) a.push(p - n); if (y < n - 1) a.push(p + n);
    for (const [dx, dy] of [[1,1],[1,-1],[-1,1],[-1,-1]]) { const X = x + dx, Y = y + dy; if (X >= 0 && Y >= 0 && X < n && Y < n) d.push(Y * n + X); }
    nb.push(a); dg.push(d);
  }
  const b = new Uint8Array(N), mark = new Int32Array(N), markL = new Int32Array(N), stk = new Int32Array(N), emp = new Int32Array(N), pos = new Int32Array(N), acc = new Float64Array(N);
  let stamp = 0, ne = 0, done = 0;
  function libs(p, max) {
    stamp++; const c = b[p]; let sp = 0, k = 0; stk[sp++] = p; mark[p] = stamp;
    while (sp) { const q = stk[--sp], a = nb[q];
      for (let i = 0; i < a.length; i++) { const r = a[i], v = b[r];
        if (v === 0) { if (markL[r] !== stamp) { markL[r] = stamp; if (++k >= max) return k; } }
        else if (v === c && mark[r] !== stamp) { mark[r] = stamp; stk[sp++] = r; } } }
    return k;
  }
  function addE(p) { pos[p] = ne; emp[ne++] = p; }
  function delE(p) { const i = pos[p], l = emp[--ne]; emp[i] = l; pos[l] = i; }
  function removeG(p) { const c = b[p]; let sp = 0, k = 1; stk[sp++] = p; b[p] = 0; addE(p);
    while (sp) { const q = stk[--sp], a = nb[q]; for (let i = 0; i < a.length; i++) { const r = a[i]; if (b[r] === c) { b[r] = 0; addE(r); k++; stk[sp++] = r; } } }
    return k; }
  function eye(p, c) { const a = nb[p]; for (let i = 0; i < a.length; i++) if (b[a[i]] !== c) return false;
    const d = dg[p]; let bad = 0; for (let i = 0; i < d.length; i++) if (b[d[i]] === 3 - c) bad++;
    return d.length < 4 ? bad === 0 : bad < 2; }
  function legal(p, c, ko) { if (p === ko) return false; const a = nb[p];
    for (let i = 0; i < a.length; i++) if (b[a[i]] === 0) return true;
    b[p] = c; let ok = false;
    for (let i = 0; i < a.length && !ok; i++) { const r = a[i]; if (b[r] === 3 - c && libs(r, 1) === 0) ok = true; }
    if (!ok) ok = libs(p, 1) > 0; b[p] = 0; return ok; }
  function place(p, c) { delE(p); b[p] = c; let cap = 0, last = -1; const a = nb[p];
    for (let i = 0; i < a.length; i++) { const r = a[i]; if (b[r] === 3 - c && libs(r, 1) === 0) { cap += removeG(r); last = r; } }
    if (cap === 1) { for (let i = 0; i < a.length; i++) if (b[a[i]] === c) return -1; if (libs(p, 2) === 1) return last; }
    return -1; }
  function playout() {
    ne = 0; for (let p = 0; p < N; p++) { b[p] = J.board[p]; if (b[p] === 0) addE(p); }
    let c = J.toPlay, passes = 0, ko = -1, m = 0; const maxM = N * 3;
    while (passes < 2 && m < maxM) {
      let moved = false;
      if (ne > 0) { const s = (Math.random() * ne) | 0;
        for (let k = 0; k < ne; k++) { const p = emp[(s + k) % ne]; if (!eye(p, c) && legal(p, c, ko)) { ko = place(p, c); moved = true; break; } } }
      if (moved) passes = 0; else { passes++; ko = -1; }
      c = 3 - c; m++;
    }
    for (let p = 0; p < N; p++) { let v = b[p];
      if (v === 0) { let bl = 0, wh = 0; const a = nb[p]; for (let i = 0; i < a.length; i++) { if (b[a[i]] === 1) bl++; else if (b[a[i]] === 2) wh++; } v = bl && !wh ? 1 : wh && !bl ? 2 : 0; }
      if (v === 1) acc[p] += 1; else if (v === 2) acc[p] -= 1; }
  }
  function chunk() {
    if (cur !== id) return;
    const t = performance.now();
    while (done < total && performance.now() - t < 50) { playout(); done++; }
    const own = new Float32Array(N); for (let p = 0; p < N; p++) own[p] = acc[p] / done;
    postMessage({ id, own, n: done });
    if (done < total) setTimeout(chunk, 0);
  }
  chunk();
}`;
const worker = new Worker(URL.createObjectURL(new Blob([WORKER], { type: 'text/javascript' })));
let jobId = 0, own = null, ownN = 0, ownTimer = null;
worker.onmessage = e => { if (e.data.id !== jobId) return; own = e.data.own; ownN = e.data.n; render(); };

// ---------- state ----------
let D = null, G = null, S = null, first = true, lastSnap = null;
let cloud = false, phantoms = [], hoverP = null, ghost = null;

R.on('value', snap => {
  D = snap.val() || {}; D.games = D.games || {}; D.presence = D.presence || {};
  const sk = D.snap ? D.snap.g + ':' + D.snap.t : null;
  if (!first && sk && sk !== lastSnap && D.snap.by !== tab && D.games[D.snap.g]) {
    lastSnap = sk; switchTo(D.snap.g); flash(`${who(D.snap.by)} brought everyone to this game.`); return;
  }
  lastSnap = sk;
  if (!viewing || !D.games[viewing]) {
    const ids = sortedGames();
    viewing = D.current && D.games[D.current] ? D.current : ids[0] || null;
    if (!viewing) { createGame(19); return; }
    ls.set('goGame', viewing);
  }
  if (first) {
    first = false;
    if (myAnimal < 0 || myAnimal >= ANIMALS.length) {
      const used = new Set(others().map(p => p.a));
      const free = ANIMALS.map((_, i) => i).filter(i => !used.has(i));
      myAnimal = free.length ? free[Math.floor(Math.random() * free.length)] : Math.floor(Math.random() * ANIMALS.length);
      ls.set('goAnimal', myAnimal);
    }
    if (myColour === null) {
      const taken = new Set(others().map(p => p.c));
      myColour = !taken.has('b') ? 'b' : !taken.has('w') ? 'w' : '';
      ls.set('goColour', myColour);
    }
    DB.ref('.info/connected').on('value', s => { if (s.val()) { presRef.onDisconnect().remove(); writePresence(); } });
  }
  const g = D.games[viewing], key = viewing + ':' + toArr(g.moves).length;
  G = g; S = replay(g);
  if (key !== render.key) { render.key = key; ghost = null; if (cloud) requestOwn(); }
  render();
});

const presRef = R.child('presence/' + tab);
function writePresence() {
  if (first) return;
  presRef.set({ a: myAnimal, n: myName.slice(0, 20), c: myColour || '', g: viewing || '', d: coarse ? 'm' : 'd', t: TS });
}
function others() { return Object.entries(D.presence).filter(([k]) => k !== tab).map(([k, v]) => ({ ...v, k })); }
function everyone() { return Object.entries(D.presence).map(([k, v]) => ({ ...v, k })); }
function label(p) { const A = ANIMALS[p.a] || ANIMALS[0]; return A[0] + ' ' + esc(p.n || A[1]); }
function who(k) { const p = D.presence[k]; return p ? label(p) : 'Someone'; }
function sortedGames() { return Object.keys(D.games).sort((a, b) => (D.games[b].created || 0) - (D.games[a].created || 0)); }

function switchTo(id) {
  viewing = id; ls.set('goGame', id);
  cloud = false; phantoms = []; hoverP = null; ghost = null; own = null;
  G = D.games[id]; S = replay(G); render.key = id + ':' + toArr(G.moves).length;
  writePresence(); render();
}

function createGame(size) {
  const ref = R.child('games').push(), leaving = viewing;
  viewing = ref.key; ls.set('goGame', viewing);
  cloud = false; phantoms = []; hoverP = null; ghost = null; own = null;
  ref.set({ size, created: TS });
  R.child('current').set(ref.key);
  if (D) prune(ref.key, leaving);
  writePresence();
}
// keep the 9 most recent games with more than 4 stones (plus any game someone else is looking at)
function prune(newId, leaving) {
  const busy = new Set(others().map(p => p.g));
  let kept = 0;
  for (const id of sortedGames()) {
    if (id === newId || !D.games[id]) continue;
    const stones = replay(D.games[id]).board.filter(Boolean).length;
    if (stones > 4 && kept < 9) kept++;
    else if (!busy.has(id)) R.child('games/' + id).remove();
  }
}

function lastMove() { const m = toArr(G.moves); return m.length ? m[m.length - 1] : null; }
function nextColour() { const m = lastMove(); return m ? other(m.c) : 'b'; }
function gameOver() { const m = toArr(G.moves), n = m.length; return n >= 2 && m[n - 1].p < 0 && m[n - 2].p < 0; }

function submit(mv) {
  const size = G.size;
  R.child(`games/${viewing}/moves`).transaction(cur => {
    const list = toArr(cur);
    if (mv.p >= 0) {
      const r = replay({ size, moves: list });
      if (!play(size, r.board, r.prev, mv.c, mv.p)) return undefined;
    }
    list.push(mv); return list;
  });
}

// ---------- trial (phantom) stones ----------
function position() {
  let board = S.board, prev = S.prev; const ok = [];
  for (const ph of phantoms) { const r = play(G.size, board, prev, ph.c, ph.p); if (!r) continue; prev = board; board = r.board; ok.push(ph); }
  phantoms = ok;
  return { board, prev };
}
function nextPhantom() { return phantoms.length ? other(phantoms[phantoms.length - 1].c) : nextColour(); }
function requestOwn() {
  if (!cloud) return;
  clearTimeout(ownTimer);
  ownTimer = setTimeout(() => {
    const n = G.size, P = position(); let board = P.board, toPlay = nextPhantom();
    if (hoverP !== null) { const r = play(n, board, P.prev, toPlay, hoverP); if (r) { board = r.board; toPlay = other(toPlay); } }
    worker.postMessage({ id: ++jobId, size: n, board: board.map(v => v === 'b' ? 1 : v === 'w' ? 2 : 0), toPlay: toPlay === 'b' ? 1 : 2, total: n === 19 ? 250 : 400 });
  }, 40);
}

// ---------- rendering ----------
const svg = document.getElementById('board');
const NS = 'http://www.w3.org/2000/svg';
function el(tag, attrs, parent) { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); parent.appendChild(e); return e; }
function stars(n) {
  const s = n === 19 ? [3, 9, 15] : n === 13 ? [3, 6, 9] : [2, 4, 6], out = [];
  for (const a of s) for (const b of s) { if (n !== 19 && (a === s[1]) !== (b === s[1])) continue; out.push([a, b]); }
  return out;
}
function drawGrid(n, parent, lw) {
  for (let i = 0; i < n; i++) {
    el('line', { x1: 1, y1: 1 + i, x2: n, y2: 1 + i, stroke: '#3b2a14', 'stroke-width': lw }, parent);
    el('line', { x1: 1 + i, y1: 1, x2: 1 + i, y2: n, stroke: '#3b2a14', 'stroke-width': lw }, parent);
  }
  for (const [a, b] of stars(n)) el('circle', { cx: 1 + a, cy: 1 + b, r: 0.12, fill: '#3b2a14' }, parent);
}
function stone(x, y, c, parent, opacity) {
  const g = el('g', { opacity: opacity || 1 }, parent);
  if (!opacity) el('circle', { cx: x, cy: y + 0.04, r: 0.47, fill: 'rgba(0,0,0,.25)' }, g);
  el('circle', { cx: x, cy: y, r: 0.47, fill: c === 'b' ? '#111' : '#fafafa', stroke: '#000', 'stroke-width': 0.03 }, g);
}

function render() {
  if (!G) return;
  const n = G.size, V = n + 1;
  const P = cloud ? position() : { board: S.board };
  const hasOwn = cloud && own && own.length === n * n;
  svg.setAttribute('viewBox', `0 0 ${V} ${V}`);
  svg.innerHTML = '';
  if (hasOwn) for (let p = 0; p < n * n; p++) {
    const v = own[p]; if (Math.abs(v) < 0.08 || P.board[p]) continue;
    el('rect', { x: p % n + 0.5, y: Math.floor(p / n) + 0.5, width: 1, height: 1, fill: v > 0 ? `rgba(0,0,0,${(v * 0.6).toFixed(2)})` : `rgba(255,255,255,${(-v * 0.8).toFixed(2)})` }, svg);
  }
  drawGrid(n, svg, 0.04);
  const lm = lastMove();
  for (let p = 0; p < n * n; p++) {
    const c = P.board[p]; if (!c) continue;
    const x = 1 + p % n, y = 1 + Math.floor(p / n), trial = S.board[p] !== c;
    stone(x, y, c, svg, trial ? 0.55 : 0);
    if (hasOwn && ((c === 'b' && own[p] < -0.4) || (c === 'w' && own[p] > 0.4)))
      el('rect', { x: x - 0.17, y: y - 0.17, width: 0.34, height: 0.34, fill: c === 'b' ? '#fff' : '#000', opacity: Math.min(1, Math.abs(own[p])).toFixed(2) }, svg);
    if (!trial && lm && lm.p === p) el('circle', { cx: x, cy: y, r: 0.2, fill: 'none', stroke: c === 'b' ? '#fff' : '#000', 'stroke-width': 0.08 }, svg);
  }
  if (cloud && hoverP !== null && !P.board[hoverP]) stone(1 + hoverP % n, 1 + Math.floor(hoverP / n), nextPhantom(), svg, 0.35);
  if (ghost !== null && !cloud) stone(1 + ghost % n, 1 + Math.floor(ghost / n), myColour, svg, 0.5);

  // banner
  const B = document.getElementById('banner'), sub = document.getElementById('sub');
  if (!flash.on) sub.textContent = '';
  if (cloud) {
    B.className = 'trial'; B.textContent = 'Trial stones';
    if (!flash.on) sub.textContent = `Tap to try moves (next: ${NAME[nextPhantom()]}). Only you see them. Press "Hide" to go back.`;
  } else if (gameOver()) { B.className = 'alert'; B.textContent = 'Both passed'; if (!flash.on) sub.textContent = 'Count your territory, or press New game.'; }
  else if (!myColour) { B.className = 'wait'; B.textContent = 'Tap Black or White to play'; }
  else if (nextColour() === myColour) {
    B.className = 'turn'; B.textContent = 'Your turn';
    if (!flash.on) sub.textContent = ghost !== null ? 'Tap the same spot again to place your stone' : (lm && lm.p < 0 ? 'The other player passed.' : '');
  } else { B.className = 'wait'; B.textContent = 'Waiting for other player'; }

  // people
  const all = everyone();
  for (const c of ['b', 'w']) {
    document.querySelector(`.bowl[data-c="${c}"]`).classList.toggle('mine', myColour === c);
    document.getElementById('cap' + c).textContent = `captured ${S.caps[c]}`;
    document.getElementById('hint' + c).textContent = myColour === c ? '' : 'tap to play';
    document.getElementById('chips' + c).innerHTML = all.filter(p => p.c === c).map(chip).join('');
  }
  const watchers = all.filter(p => !p.c);
  document.getElementById('watchers').innerHTML = `<span>${all.length} online${watchers.length ? ' · watching:' : ''}</span>` + watchers.map(chip).join('');

  // notice about people on other games
  const away = others().filter(p => p.g && p.g !== viewing && D.games[p.g]);
  const N = document.getElementById('notice');
  if (away.length) {
    const games = [...new Set(away.map(p => p.g))];
    N.innerHTML = games.map(g => { const ps = away.filter(p => p.g === g);
      return `${ps.map(label).join(', ')} ${ps.length > 1 ? 'are' : 'is'} on a different game (${D.games[g].size}×${D.games[g].size}) <button data-go="${g}">Go there</button>`; }).join('<br>')
      + `<br><button id="snap">Bring everyone to this game</button>`;
    N.style.display = 'block';
  } else N.style.display = 'none';

  let est = cloud ? 'Thinking…' : '';
  if (hasOwn) { let b = 0, w = 0; for (const v of own) { b += (1 + v) / 2; w += (1 - v) / 2; }
    est = `Estimate: Black ≈ ${Math.round(b)}, White ≈ ${Math.round(w)} points (no komi) · ${ownN} simulations`; }
  document.getElementById('estimate').textContent = est;

  document.getElementById('pass').disabled = cloud || !myColour;
  document.getElementById('undo').disabled = cloud ? !phantoms.length : !toArr(G.moves).length;
  const cb = document.getElementById('cloud'); cb.textContent = cloud ? 'Hide' : 'Territory'; cb.classList.toggle('on', cloud);
  renderGrid();
}
function chip(p) {
  const you = p.k === tab, away = p.g !== viewing;
  const info = (p.d === 'm' ? 'On a phone' : 'On a computer') + (away ? ', looking at a different game' : '') + (you ? ' – tap to change your name' : '');
  return `<span class="chip${you ? ' you' : ''}${away ? ' away' : ''}" title="${info}" ${you ? 'data-you="1"' : ''}>${label(p)}${you ? ' (you)' : ''} ${p.d === 'm' ? '📱' : '💻'}</span>`;
}
function renderGrid() {
  const ids = sortedGames().filter(id => id !== viewing).slice(0, 9);
  const busy = {}; for (const p of others()) (busy[p.g] = busy[p.g] || []).push(p);
  const key = ids.map(id => id + ':' + toArr(D.games[id].moves).length + ':' + (busy[id] || []).map(p => p.a + p.n).join()).join('|');
  if (key === renderGrid.key) return;
  renderGrid.key = key;
  const grid = document.getElementById('grid'); grid.innerHTML = '';
  document.getElementById('others').style.display = ids.length ? 'block' : 'none';
  for (const id of ids) {
    const g = D.games[id], n = g.size, b = replay(g).board, ppl = busy[id] || [];
    const d = document.createElement('div'); d.className = 'thumb' + (ppl.length ? ' live' : ''); d.dataset.id = id;
    const s = el('svg', { viewBox: `0 0 ${n + 1} ${n + 1}` }, d);
    drawGrid(n, s, 0.06);
    b.forEach((c, p) => { if (c) el('circle', { cx: 1 + p % n, cy: 1 + Math.floor(p / n), r: 0.46, fill: c === 'b' ? '#111' : '#fafafa', stroke: '#000', 'stroke-width': 0.04 }, s); });
    const when = g.created ? new Date(g.created).toLocaleString(undefined, { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }) : '';
    const t = document.createElement('div'); t.className = 'tl';
    t.innerHTML = `${n}×${n} · ${toArr(g.moves).length} moves<br>${when}${ppl.length ? '<br>' + ppl.map(label).join(' ') : ''}`;
    d.appendChild(t); grid.appendChild(d);
  }
}

// ---------- input ----------
function pointAt(ev) {
  const r = svg.getBoundingClientRect(), n = G.size, V = n + 1;
  const x = Math.round((ev.clientX - r.left) / r.width * V - 1), y = Math.round((ev.clientY - r.top) / r.height * V - 1);
  return x < 0 || y < 0 || x >= n || y >= n ? null : y * n + x;
}
svg.addEventListener('click', ev => {
  if (!G) return;
  const p = pointAt(ev); if (p === null) return;
  if (cloud) {
    const i = phantoms.findIndex(ph => ph.p === p);
    if (i >= 0) phantoms.splice(i, 1);
    else {
      const P = position(), c = nextPhantom();
      if (!play(G.size, P.board, P.prev, c, p)) { flash(play.why); return; }
      phantoms.push({ c, p });
    }
    hoverP = null; render(); requestOwn(); return;
  }
  if (!myColour) { flash('First tap Black or White above the board to choose your colour.'); return; }
  if (!play(G.size, S.board, S.prev, myColour, p)) { ghost = null; render(); flash(play.why); return; }
  if (coarse && ghost !== p) { ghost = p; render(); return; }
  ghost = null;
  submit({ c: myColour, p });
});
svg.addEventListener('mousemove', ev => {
  if (!cloud || !G || coarse) return;
  let p = pointAt(ev);
  if (p !== null && position().board[p]) p = null;
  if (p === hoverP) return;
  hoverP = p; render(); requestOwn();
});
svg.addEventListener('mouseleave', () => { if (cloud && hoverP !== null) { hoverP = null; render(); requestOwn(); } });

function flash(msg) {
  const sub = document.getElementById('sub'); sub.textContent = msg; sub.style.color = '#c62828'; flash.on = true;
  clearTimeout(flash.t); flash.t = setTimeout(() => { sub.style.color = ''; flash.on = false; render(); }, 2500);
}
function dialog(msg, buttons) {
  document.getElementById('dmsg').textContent = msg;
  const row = document.getElementById('dbtns'); row.innerHTML = '';
  for (const [text, fn, primary] of buttons) {
    const b = document.createElement('button'); b.textContent = text; if (primary) b.className = 'primary';
    b.onclick = () => { document.getElementById('dialog').style.display = 'none'; fn && fn(); }; row.appendChild(b);
  }
  document.getElementById('dialog').style.display = 'flex';
}

document.getElementById('pass').onclick = () => submit({ c: myColour, p: -1 });
document.getElementById('undo').onclick = () => {
  if (cloud) { phantoms.pop(); render(); requestOwn(); return; }
  R.child(`games/${viewing}/moves`).transaction(cur => { const l = toArr(cur); l.pop(); return l; });
};
document.getElementById('cloud').onclick = () => {
  cloud = !cloud; phantoms = []; hoverP = null; ghost = null; own = null;
  render(); requestOwn();
};
document.getElementById('new').onclick = () => dialog('Start a new game? This one is kept at the bottom of the page. Board size:', [
  ['19×19', () => createGame(19), true], ['13×13', () => createGame(13)], ['9×9', () => createGame(9)], ['Cancel']]);
document.querySelectorAll('.bowl').forEach(b => b.onclick = () => {
  const c = b.dataset.c;
  myColour = myColour === c ? '' : c; ls.set('goColour', myColour);
  ghost = null; writePresence(); render();
});
document.getElementById('app').addEventListener('click', ev => {
  const t = ev.target;
  if (t.closest('[data-you]')) {
    ev.stopPropagation();
    const n = prompt('Your name (shown to the other player):', myName);
    if (n !== null) { myName = n.trim().slice(0, 20); ls.set('goName', myName); writePresence(); }
    return;
  }
  if (t.dataset.go) { switchTo(t.dataset.go); return; }
  if (t.id === 'snap') { R.child('snap').set({ g: viewing, by: tab, t: TS }); return; }
  const th = t.closest('.thumb'); if (th) { switchTo(th.dataset.id); window.scrollTo({ top: 0, behavior: 'smooth' }); }
}, true);
</script>
</body>
</html>
