<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Map</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://tiles.openfreemap.org" crossorigin>
<link rel="preconnect" href="https://api.github.com" crossorigin>
<link rel="stylesheet" href="maplibre/maplibre-gl.css">
<style>
  html, body { height: 100%; margin: 0; font: 13px/1.3 "Segoe UI", system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; color: #2b2b2a; }
  #app { display: flex; height: 100%; }
  #side { position: relative; width: 250px; flex: none; display: flex; flex-direction: column; border-right: 1px solid #e4e3df; background: #fcfcfb; }
  #grip { position: absolute; top: 0; bottom: 0; right: -5px; width: 10px; cursor: ew-resize; z-index: 20; touch-action: none; }
  #map { flex: 1; min-width: 0; position: relative; }
  #top { padding: 8px 8px 6px; border-bottom: 1px solid #ecebe7; }
  #q { width: 100%; box-sizing: border-box; padding: 6px 8px; font: inherit; border: 1px solid #cfcec9; border-radius: 6px; }
  #timeRow { display: flex; align-items: center; gap: 5px; margin-top: 6px; white-space: nowrap; }
  /* a box you click: slightly greyed out, or selected */
  .tog { font: inherit; font-size: 12px; padding: 2px 9px; border: 1px solid #dcdbd6; border-radius: 6px; background: #f3f2ef; color: #9a9993; cursor: pointer; user-select: none; }
  .tog.on { background: #fff; border-color: #2b2b2a; color: #2b2b2a; box-shadow: inset 0 0 0 1px #2b2b2a; }
  #timeText { font-variant-numeric: tabular-nums; font-size: 12px; margin-left: auto; }
  .spanbox { display: block; margin-top: 5px; padding: 3px 0; }
  .dual { position: relative; height: 20px; opacity: .45; }
  .dual.on { opacity: 1; }
  .dual::before { content: ""; position: absolute; left: 7px; right: 7px; top: 8px; height: 4px; border-radius: 2px;
                  background: linear-gradient(to right, #dcdbd6 var(--a, 0%), #2a78d6 var(--a, 0%) var(--b, 0%), #dcdbd6 var(--b, 0%)); }
  .dual input { position: absolute; left: 0; top: 0; width: 100%; height: 20px; margin: 0; background: none; pointer-events: none;
                -webkit-appearance: none; appearance: none; }
  .dual input::-webkit-slider-runnable-track { background: none; }
  .dual input::-moz-range-track { background: none; }
  .dual input::-webkit-slider-thumb { -webkit-appearance: none; pointer-events: auto; width: 14px; height: 14px; border-radius: 50%;
                background: #2a78d6; border: 0; cursor: pointer; }
  .dual input::-moz-range-thumb { pointer-events: auto; width: 14px; height: 14px; border-radius: 50%; background: #2a78d6; border: 0; cursor: pointer; }
  #listWrap { position: relative; flex: 1; min-height: 0; }
  #list { height: 100%; overflow-y: auto; }
  .tline { position: absolute; top: 0; bottom: 0; width: 1px; background: rgba(43,43,42,.6); pointer-events: none; z-index: 3; display: none; }
  .tline.span { width: 2px; margin-left: -1px; background: rgba(42,120,214,.55); }   /* the chosen interval, blue like the slider */
  #bottom { padding: 6px 8px 8px; border-top: 1px solid #ecebe7; }
  #chips { display: flex; flex-wrap: wrap; gap: 4px; }
  .chip { border: 1px solid #cfcec9; border-radius: 999px; padding: 1px 8px 1px 6px; background: #fff; font: inherit; font-size: 12px; cursor: pointer; user-select: none; }
  .chip .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; background: var(--c); }
  .chip.off { color: #a3a29c; }
  .chip.off .dot { background: #d6d5d0; }
  #opts { display: flex; gap: 5px; margin-top: 6px; }
  h2 { font-size: 10px; text-transform: uppercase; letter-spacing: .06em; color: #7b7a74; margin: 8px 9px 2px; font-weight: 600;
       cursor: pointer; user-select: none; }
  h2 .tri { display: inline-block; width: 10px; font-size: 9px; }
  .item { margin: 2px 7px; border-radius: 4px; cursor: pointer; border-left: 3px solid var(--c); overflow: hidden; user-select: none; }
  .row { display: flex; align-items: center; gap: 6px; padding: 2px 6px; }
  .row b { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row small { color: #55544f; font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1 10 0; }
  .item.dim { border-left-color: #d6d5d0; filter: grayscale(1); }
  .item.explore { border-left-style: dashed; opacity: .72; }
  .item.explore .row b { color: #8b8a85; font-weight: 500; font-style: italic; }
  .item.dim .row b, .item.dim .row small { color: #a3a29c; }
  .item.dim .logo { opacity: .4; }
  .item.open .row b, .more { user-select: text; }
  .logo { width: 18px; height: 18px; border-radius: 4px; flex: none; object-fit: cover; }
  .logo.ph { display: flex; align-items: center; justify-content: center; background: var(--c); color: #fff; font-weight: 700; font-size: 11px; }
  .more { padding: 2px 6px 6px; background: rgba(255,255,255,.74); font-size: 12px; color: #44433f; cursor: text; }
  .more img { width: 100%; border-radius: 4px; display: block; margin-bottom: 4px; }
  #note { margin: 8px 9px; color: #7b7a74; font-size: 12px; }
  #tip { display: none; position: fixed; z-index: 30; white-space: pre; background: #2b2b2a; color: #fff; font-size: 12px;
         line-height: 1.45; padding: 5px 8px; border-radius: 5px; pointer-events: none; box-shadow: 0 2px 8px rgba(0,0,0,.2); }
  #forget { display: block; margin: 12px 9px 8px; color: #a3a29c; font-size: 11px; }
  #toggle { display: none; position: absolute; top: 10px; left: 10px; z-index: 5; padding: 8px 13px; background: #fff;
            border: 0; border-radius: 6px; box-shadow: 0 0 0 2px rgba(0,0,0,.1); font: inherit; font-weight: 600; }
  /* my location: white disc with a deep blue dot and a pulsing ring; with a compass, an arrow and a beam the way I face */
  .me { width: 96px; height: 96px; pointer-events: none; }
  .me .beam { position: absolute; inset: 0; border-radius: 50%; display: none;
    background: conic-gradient(from -28deg, rgba(26,86,219,.5) 0deg 56deg, transparent 56deg);
    -webkit-mask: radial-gradient(circle closest-side, #000 25%, transparent 100%); mask: radial-gradient(circle closest-side, #000 25%, transparent 100%); }
  .me .pin { position: absolute; left: 37px; top: 37px; width: 22px; height: 22px; border-radius: 50%; background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,.45); }
  .me .pin::after { content: ""; position: absolute; inset: -5px; border-radius: 50%; border: 2px solid rgba(26,86,219,.55); animation: mepulse 2s ease-out infinite; }
  .me svg { position: absolute; left: 0; top: 0; width: 22px; height: 22px; }
  .me .arrow, .me.hd .dot { display: none; }
  .me.hd .arrow, .me.hd .beam { display: block; }
  @keyframes mepulse { from { transform: scale(.75); opacity: 1; } to { transform: scale(1.7); opacity: 0; } }
  .pin { width: 12px; height: 12px; border-radius: 50%; background: #2b2b2a; border: 3px solid #fff; box-shadow: 0 0 0 1px #2b2b2a; }
  .pop { font: 13px/1.35 "Segoe UI", system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
  .pop img.photo { width: 100%; border-radius: 6px; display: block; margin-bottom: 6px; }
  .pop small { color: #6b6a65; display: block; }
  .pop .q { color: #a04a00; }
  .maplibregl-popup-content { padding: 10px 12px; border-radius: 8px; }
  #addMenu { display: none; position: absolute; top: 44px; left: 10px; z-index: 6; background: #fff; border-radius: 6px; box-shadow: 0 0 0 2px rgba(0,0,0,.1); overflow: hidden; }
  #addMenu button { display: flex; align-items: center; gap: 9px; width: 100%; text-align: left; padding: 8px 14px 8px 11px; border: 0; background: none; font: inherit; cursor: pointer; }
  #addMenu button:hover { background: #f1f0ec; }
  #addMenu svg { width: 16px; height: 16px; flex: none; fill: none; stroke: #2b2b2a; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; }
  #addBar { display: none; position: absolute; left: 50%; transform: translateX(-50%); bottom: 34px; z-index: 6; width: min(340px, calc(100% - 24px));
            background: #fff; border-radius: 8px; box-shadow: 0 2px 14px rgba(0,0,0,.25); padding: 10px 12px; box-sizing: border-box; }
  #addBar textarea { width: 100%; box-sizing: border-box; height: 64px; font: inherit; margin: 6px 0; padding: 6px; border: 1px solid #cfcec9; border-radius: 6px; resize: vertical; }
  #addBar .btns { display: flex; gap: 6px; margin-top: 8px; align-items: center; }
  #addBar button { font: inherit; padding: 5px 12px; border: 1px solid #cfcec9; border-radius: 6px; background: #fff; cursor: pointer; }
  #addBar button.go { background: #2b2b2a; border-color: #2b2b2a; color: #fff; }
  #addMsg { color: #a04a00; font-size: 12px; flex: 1; }
  #gate { position: fixed; inset: 0; z-index: 2000; background: #fcfcfb; display: none; align-items: center; justify-content: center; }
  #gate form { width: min(340px, 86vw); }
  #gate input { width: 100%; box-sizing: border-box; padding: 8px; font: 14px Consolas, monospace; margin: 8px 0; }
  #gate button { padding: 7px 16px; font: inherit; }
  #gateMsg { color: #a04a00; min-height: 1.4em; margin-top: 8px; }
  @media (max-width: 700px) {
    #side { display: none; position: absolute; z-index: 10; top: 0; bottom: 0; left: 0; max-width: 92vw; box-shadow: 0 0 24px rgba(0,0,0,.25); }
    #app.list #side { display: flex; }
    #toggle { display: block; }
    #app.list ~ #toggle { left: auto; right: 10px; z-index: 11; }
    .maplibregl-ctrl-top-left { top: 44px; }
    #addMenu { top: 88px; }
  }
</style>
</head>
<body>
<div id="gate">
  <form id="gateForm">
    <label for="token">GitHub token</label>
    <input id="token" type="password" autocomplete="off" spellcheck="false">
    <button>Open</button>
    <div id="gateMsg"></div>
  </form>
</div>
<div id="app">
  <div id="side">
    <div id="top">
      <input id="q" type="search" placeholder="Search name, 中文, area, chain" autocomplete="off">
      <div id="timeRow">
        <button class="tog on" id="tAny" title="Do not grey anything out">Any time</button>
        <button class="tog" id="tNow" title="Grey out what is closed now">Open now</button>
        <span id="timeText"></span>
      </div>
      <div class="tog spanbox" id="spanBox" title="Grey out what is closed between these times">
        <div class="dual" id="dual"><input id="s1" type="range" min="0" max="23" step="1"><input id="s2" type="range" min="0" max="23" step="1"></div>
      </div>
    </div>
    <div id="listWrap"><div id="list"></div><div class="tline" id="tlNow"></div><div class="tline span" id="tl1"></div><div class="tline span" id="tl2"></div></div>
    <div id="bottom">
      <div id="chips" title="Click: show or hide a type. Shift+click: only that type."></div>
      <div id="opts">
        <button class="tog" id="zhOn">中文</button>
        <button class="tog on" id="fogOn" title="Hide the parts of Beijing not explored yet under fog">Fog</button>
        <button class="tog" id="blocksOn">Blocks</button>
        <button class="tog on" id="mallsOn">Malls</button>

      </div>
    </div>
    <div id="grip"></div>
  </div>
  <div id="map">
    <div id="addMenu">
      <button data-kind="point"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="3.2"/></svg>Point</button>
      <button data-kind="path"><svg viewBox="0 0 16 16"><path d="M2 12 6 5l4 5 4-7"/><circle cx="2" cy="12" r="1"/><circle cx="14" cy="3" r="1"/></svg>Path</button>
      <button data-kind="region"><svg viewBox="0 0 16 16"><path d="M3 5 9 2l5 4-2 7H5z"/></svg>Region</button>
      <button data-kind="block"><svg viewBox="0 0 16 16"><rect x="2" y="2" width="5" height="5"/><rect x="9" y="2" width="5" height="5"/><rect x="2" y="9" width="5" height="5"/><rect x="9" y="9" width="5" height="5"/></svg>Block</button>
      <button data-kind="note"><svg viewBox="0 0 16 16"><path d="M3 13l1-3 7-7 2 2-7 7zM10 4l2 2"/></svg>Note or picture</button>
    </div>
    <div id="addBar">
      <b id="addTitle"></b>
      <div id="addHint" style="color:#6b6a65"></div>
      <div id="addForm">
        <textarea id="addText" placeholder="What is it?"></textarea>
        <input id="addPic" type="file" accept="image/*">
      </div>
      <div class="btns"><span id="addMsg"></span><button id="addUndo" type="button">Undo</button><button id="addDone" type="button">Done</button><button id="addCancel" type="button">Cancel</button><button id="addSave" class="go" type="button">Save</button></div>
    </div>
  </div>
</div>
<button id="toggle">List</button>

<script src="maplibre/maplibre-gl.js"></script>
<script>
// The place data is not in this (public) site. It is read from a private GitHub
// repository with a token that the visitor types in once; the token stays in this browser.
const DATA = "https://api.github.com/repos/alyoshalatyntsev/beijing-map-data/contents/";
const LOCAL = location.hostname === "localhost";   // the data repo served from disk, for testing
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
// area colours: Google Maps-like yellows for somewhat/very busy, greens for parks and palaces, grey for places to avoid,
// pale lilac for campuses (drawn underneath the rest), pale aqua with a ? for areas still to explore
const AREA = { busy: ["#fdefc3", 0.8], very_busy: ["#fbd766", 0.7], green: ["#cfe8c3", 0.8], green_dark: ["#9bd19a", 0.75], grey: ["#bdbdb9", 0.6], mixed: ["#cfc8ad", 0.75],
               campus: ["#e6e0f2", 0.75], explore: ["#cdeee8", 0.65] };
const FILES = ["places.json", "chains.json", "logos.json", "areas.json", "malls.json", "temples.json"];

function askToken(msg) {
  $("gateMsg").textContent = msg || "";
  $("gate").style.display = "flex";
  $("token").focus();
}

// Each data file is kept in this browser with its version tag, so the next visit draws at once
// and only asks GitHub whether anything changed.
const kept = f => { try { return JSON.parse(localStorage.getItem("mapData:" + f)); } catch (e) { return null; } };
async function get(f) {
  if (LOCAL) { const r = await fetch("../../" + f); return r.ok ? r.json() : {}; }
  const old = kept(f), headers = { Authorization: "Bearer " + localStorage.getItem("mapToken"), Accept: "application/vnd.github.raw+json" };
  if (old) headers["If-None-Match"] = old.tag;
  const r = await fetch(DATA + f, { headers });
  if (r.status === 304) return old.data;
  if (r.status === 404 && f !== "places.json") return {};
  if (!r.ok) throw r.status;
  const data = await r.json();
  try { localStorage.setItem("mapData:" + f, JSON.stringify({ tag: r.headers.get("ETag"), data })); } catch (e) {}
  return data;
}

// things added from the map go into inbox/ in the data repository, for an agent to look at later
const SAVED = [];
async function put(path, b64) {
  if (LOCAL) return void SAVED.push(path);
  const r = await fetch(DATA + path, { method: "PUT",
    headers: { Authorization: "Bearer " + localStorage.getItem("mapToken"), Accept: "application/vnd.github+json" },
    body: JSON.stringify({ message: "Inbox: " + path.split("/").pop(), content: b64 }) });
  if (!r.ok) throw r.status;
}
const b64text = s => { const u = new TextEncoder().encode(s); let b = ""; for (const c of u) b += String.fromCharCode(c); return btoa(b); };
function shrink(file) {   // picture as JPEG, at most 1600 px on the long side, base64 without the prefix
  return new Promise((ok, bad) => {
    const img = new Image();
    img.onload = () => {
      const k = Math.min(1, 1600 / Math.max(img.width, img.height)), c = document.createElement("canvas");
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      ok(c.toDataURL("image/jpeg", 0.82).split(",")[1]);
    };
    img.onerror = bad;
    img.src = URL.createObjectURL(file);
  });
}

$("gateForm").onsubmit = e => {
  e.preventDefault();
  const t = $("token").value.trim();
  if (!t) return;
  localStorage.setItem("mapToken", t);
  $("gateMsg").textContent = "Loading...";
  start();
};
const setList = on => { $("app").classList.toggle("list", on); $("toggle").textContent = on ? "Map" : "List"; };
$("toggle").onclick = () => setList(!$("app").classList.contains("list"));

// Opening hours: "HH:MM-HH:MM" for every day, or 7 strings Monday..Sunday; "closed"; several spans joined by ",".
const toMin = t => { const [h, m] = t.split(":"); return h * 60 + +m; };
const hhmm = m => String(Math.floor(m / 60)).padStart(2, "0") + ":" + String(m % 60).padStart(2, "0");
const dayHours = (p, d) => Array.isArray(p.hours) ? p.hours[d] : p.hours;
function spans(s) {
  if (!s || s === "closed") return [];
  return s.split(",").map(x => { let [a, b] = x.split("-").map(toMin); if (b <= a) b += 1440; return [a, b]; });
}
// open for the whole of a..b (minutes of day d); a == b asks about one moment
function isOpen(p, d, a, b) {
  if (p.hours == null) return null;
  const covers = (s, e, x, y) => s <= x && (x === y ? y < e : y <= e);
  return spans(dayHours(p, d)).some(([s, e]) => covers(s, e, a, b))
    || spans(dayHours(p, (d + 6) % 7)).some(([s, e]) => covers(s, e, a + 1440, b + 1440));
}
const now = () => { const t = new Date(); return { day: (t.getDay() + 6) % 7, min: t.getHours() * 60 + t.getMinutes() }; };
// is an event on at minute m of day d (Monday = 0), or how many minutes until the next one starts (within 6 hours)
function eventState(p, d, m) {
  if (!p.events) return null;
  let live = null, soon = null;
  const today = new Date();
  for (const e of p.events) for (const k of [-1, 0, 1]) {
    const date = new Date(today.getTime() + k * 864e5), dd = (d + 7 + k) % 7;
    const iso = date.getFullYear() + "-" + String(date.getMonth() + 1).padStart(2, "0") + "-" + String(date.getDate()).padStart(2, "0");
    if (e.days ? !e.days.includes(dd) : e.date !== iso) continue;
    const s0 = toMin(e.start) + 1440 * k;
    let e0 = toMin(e.end) + 1440 * k;
    if (e0 <= s0) e0 += 1440;
    if (s0 <= m && m < e0) live = e;
    else if (s0 > m && s0 - m <= 360 && (soon == null || s0 - m < soon.wait)) soon = { e, wait: s0 - m };
  }
  return live ? { live } : soon;
}

// ---- state ----
let CATEGORIES = {}, PLACES = [], LOGOS = {}, AREAS = [], ROUTES = [], LABELS = [], MALLS = [], TEMPLES = [], PHOTOS = {}, byId = {}, order = [];
let cats = null, expanded = null, mode = null, when = "any";
const folded = new Set(JSON.parse(localStorage.getItem("mapFolded") || "[]"));   // types whose list is folded up   // when: "any" | "now" | "span"
let map = null, ready = false, popup = null;
const catKey = p => p.category in CATEGORIES ? p.category : "other";
const label = p => p.name + (p.explore ? " ?" : "");
const color = p => p.tint || CATEGORIES[catKey(p)].color;
const TINT = { green: "#5aa469", green_dark: "#3d8b4f", busy: "#e0a800", very_busy: "#d08a00", grey: "#8b8b86", mixed: "#958c6c", campus: "#9d8fc7", explore: "#3f8f84" };
// a polygon from one ring, or from a list of rings (outline first, then holes)
const poly = (rings, props) => ({ type: "Feature", properties: props,
  geometry: { type: "Polygon", coordinates: typeof rings[0][0] === "number" ? [rings] : rings } });
const fc = features => ({ type: "FeatureCollection", features });

function setData(d) {
  CATEGORIES = d[0].categories;
  PLACES = d[0].places.concat(d[1].places || []).filter(p => p.lat != null);
  LOGOS = d[2] || {}; AREAS = (d[3] || {}).areas || []; ROUTES = (d[3] || {}).paths || []; LABELS = (d[3] || {}).labels || []; MALLS = (d[4] || {}).malls || []; TEMPLES = (d[5] || {}).temples || [];
  // temples are listed (English name, picture, hours) but drawn on the map only as discs
  for (const t of TEMPLES) PLACES.push({ id: "temple:" + t.uid, name: t.en || t.name, name_zh: t.name, category: "temple",
    hours: t.hours == null ? null : t.hours, lat: t.lat, lon: t.lon, noMarker: true, small: t.small, outer: t.outer });
  // areas with opening hours (parks, palaces, temples) are listed under Landmark, in their own colour
  const seenArea = {};
  for (const a of AREAS) {
    if (!a.hours || seenArea[a.id]) continue;
    const pieces = AREAS.filter(b => b.id === a.id), pts = pieces.flatMap(b => b.polygon);
    seenArea[a.id] = true;
    PLACES.push({ id: "area:" + a.id, name: a.name, category: "landmark", hours: a.hours, isArea: true, tint: TINT[a.level],
      lon: pts.reduce((x, p) => x + p[0], 0) / pts.length, lat: pts.reduce((x, p) => x + p[1], 0) / pts.length });
  }
  byId = {};
  for (const p of PLACES) byId[p.id] = p;
  if (order.join() !== Object.keys(CATEGORIES).join()) {
    order = Object.keys(CATEGORIES);
    cats = new Set(order);
    chips();
  }
  layers();
  render();
}

async function start() {
  if (!localStorage.getItem("mapToken") && !LOCAL) return askToken();
  $("gate").style.display = "none";
  if (!map) makeMap();
  const old = FILES.map(kept);
  if (old[0] && old[1]) setData(old.map(o => o ? o.data : {}));      // draw what this browser already has
  try {
    const fresh = await Promise.all(FILES.map(get));
    if (JSON.stringify(fresh) !== JSON.stringify(old.map(o => o ? o.data : {}))) setData(fresh);
    get("photos.json").then(p => { PHOTOS = Object.assign(p, PHOTOS); }).catch(() => {});   // pictures of the inside, loaded last
    get("temple_photos.json").then(p => {
      for (const uid in p) PHOTOS["temple:" + uid] = LOGOS["temple:" + uid] = p[uid];
      render();
    }).catch(() => {});
  } catch (e) {

}

// ---- list ----
function hoursLine(p) {

// deeper colour between opening and closing time; the tab's width is 0h to 24h
const pct = m => (m / 14.4).toFixed(2) + "%";
function band(p, day) {
  const c = color(p), base = "color-mix(in srgb, " + c + " 9%, #fff)", deep = "color-mix(in srgb, " + c + " 36%, #fff)";
  if (p.hours == null || p.chainSummary) return base;
  const segs = [];
  for (const [, b] of spans(dayHours(p, (day + 6) % 7))) if (b > 1440) segs.push([0, b - 1440]);
  for (const [a, b] of spans(dayHours(p, day))) segs.push([a, Math.min(b, 1440)]);
  segs.sort((x, y) => x[0] - y[0]);
  const stops = [];
  let pos = 0;
  for (const [a, b] of segs) {
    const A = Math.max(a, pos);
    if (b <= A) continue;
    stops.push(base + " " + pct(pos) + " " + pct(A), deep + " " + pct(A) + " " + pct(b));
    pos = b;
  }
  stops.push(base + " " + pct(pos) + " 100%");
  return "linear-gradient(to right, " + stops.join(", ") + ")";
}

// a vertical line down the list at the time now, and two blue ones at the ends of a chosen interval;
// the slider sits on the same 0h-24h scale as the tabs: its ends are 00:15 and 23:15

// opening hours as text for a tooltip: days with the same hours run together, e.g. "Mon closed / Tue-Sun 10:00-24:00"
function hoursText(p) {
  if (p.hours == null) return "";
  if (!Array.isArray(p.hours)) return "Every day " + p.hours.replace(/,/g, ", ");
  const D = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"], out = [];
  for (let i = 0; i < 7;) {
    let j = i;
    while (j + 1 < 7 && p.hours[j + 1] === p.hours[i]) j++;
    out.push((i === j ? D[i] : D[i] + "-" + D[j]) + " " + p.hours[i].replace(/,/g, ", "));
    i = j + 1;

function render() {
  if (!cats) return;
  const q = $("q").value.trim().toLowerCase(), t = at(), zh = $("zhOn").classList.contains("on");
  const a = $("s1").value * 60 + 15, b = $("s2").value * 60 + 15;
  $("timeText").textContent = when === "span" ? (a === b ? hhmm(a) : hhmm(Math.min(a, b)) + "-" + hhmm(Math.max(a, b))) : hhmm(t.a);
  const text = p => [p.name, p.name_zh, p.area, p.address, CATEGORIES[catKey(p)].label, p.chain].join(" ").toLowerCase();
  const shown = PLACES.filter(p => cats.has(catKey(p)) && (!q || text(p).includes(q)));
  // not open at the chosen time: greyed out, in the list and on the map, never removed
  const dim = new Set(when === "any" ? [] : shown.filter(p => isOpen(p, t.day, t.a, t.b) === false).map(p => p.id));
  if (ready) areaShapes();
  if (ready) map.getSource("glow").setData(fc(shown.map(p => [p, eventState(p, t.day, t.a)]).filter(([, e]) => e).map(([p, e]) => ({
    type: "Feature", geometry: { type: "Point", coordinates: [p.lon, p.lat] },
    // on now: a full glowing circle; within 6 hours: faint, growing from small as the start gets near
    properties: { live: !!e.live, k: e.live ? 1 : 0.3 + 0.7 * (1 - e.wait / 360) } }))));
  if (ready) map.getSource("temples").setData(fc(shown.filter(p => p.category === "temple").map(p => ({ type: "Feature",
    properties: { id: p.id, k: p.small ? 0.5 : 1, shut: dim.has(p.id), outer: !!p.outer }, geometry: { type: "Point", coordinates: [p.lon, p.lat] } }))));
  if (ready) map.getSource("places").setData(fc(shown.filter(p => !p.isArea && !p.noMarker).map(p => ({
    type: "Feature", geometry: { type: "Point", coordinates: [p.lon, p.lat] },
    properties: { id: p.id, name: p.name, color: color(p), chain: !!p.chain, faint: p.located === "approx", shut: dim.has(p.id), explore: !!p.explore } }))));

  const list = $("list"), scroll = list.scrollTop;
  list.textContent = "";
  for (const key of order) {
    const here = shown.filter(p => catKey(p) === key);
    if (!here.length) continue;
    const h = document.createElement("h2");
    h.innerHTML = "<span class='tri'>" + (folded.has(key) ? "&#9656;" : "&#9662;") + "</span>" + esc(CATEGORIES[key].label)
      + (folded.has(key) ? " <span style='text-transform:none;letter-spacing:0'>(" + here.length + ")</span>" : "");
    h.onclick = () => {
      folded.has(key) ? folded.delete(key) : folded.add(key);

    for (const p of here.filter(p => !p.chain).sort((x, y) => x.name.localeCompare(y.name)))
      list.appendChild(item(p, p.name, zh ? p.name_zh : "", null, dim.has(p.id), () => centre(p), () => zoomIn(p)));
    const chains = {};
    for (const p of here.filter(p => p.chain)) (chains[p.chain] = chains[p.chain] || []).push(p);
    for (const c in chains) {
      const branches = chains[c].sort((x, y) => (x.name_zh || "").localeCompare(y.name_zh || "", "zh"));
      if (q) for (const p of branches)
        list.appendChild(item(p, p.name_zh || p.name, "", c, dim.has(p.id), () => centre(p), () => zoomIn(p)));
      else list.appendChild(item(Object.assign({}, branches[0], { chainSummary: true }), branches[0].name, branches.length + " branches", c, false, () => {
        $("q").value = branches[0].name; render();

      }));

  f.onclick = e => {
    e.preventDefault();

}

// ---- map ----
function areaShapes() {
  const t = at();
  map.getSource("areas").setData(fc(AREAS.map((a, i) => poly([a.polygon].concat(a.holes || []), { i, name: a.name, kind: a.kind || "",
    color: (AREA[a.level] || AREA.busy)[0], opacity: (AREA[a.level] || AREA.busy)[1],

function layers() {   // (re)fill the area and mall layers from the data

// ---- fog of war ----
// Unexplored Beijing lies under a light grey fog. It is clear around every place I have been to (not the ones still marked ?,
// not chain branches), around every explored area and along every path, and fades out softly, with an uneven edge.
// The fog is painted once into a canvas in Web Mercator (so it lines up with the map) and laid on the map as an image: above
// the base map, its names and the coloured areas, below my markers and names. Outside the canvas the fog goes on as a plain fill.
// Repainted only when the places, areas or paths change, never per frame.
const FOG = {
  rgb: [220, 219, 214], alpha: 0.97,                    // light warm grey, nearly opaque: streets and names under it cannot be read
  box: [116.10, 39.70, 116.75, 40.15], width: 1536,      // canvas: west, south, east, north; pixels across (about 36 m each)
  place: [350, 700, 130],     // each: fully clear up to (m), fog again from (m), how far the noise may move the edge (m)
  area: [100, 400, 90],       // distance counted from the area's outline (inside it is always clear)
  path: [100, 300, 90],       // distance counted from the line
  seed: [11, 23, 37, 51],
};
function fogWanted() { try { return localStorage.getItem("mapFog") !== "0"; } catch (e) { return true; } }
let fogSig = "", fogBusy = "", fogToken = 0;

// distance in metres from the nearest seed (m: 0 on seeds, huge elsewhere): Felzenszwalb's two passes
function edt(m, w, h, metres) {
  const n = Math.max(w, h), f = new Float64Array(n), d = new Float64Array(n), v = new Int32Array(n), z = new Float64Array(n + 1);
  const run = len => {
    let k = 0;
    v[0] = 0; z[0] = -1e30; z[1] = 1e30;
    for (let q = 1; q < len; q++) {
      let s = ((f[q] + q * q) - (f[v[k]] + v[k] * v[k])) / (2 * q - 2 * v[k]);
      while (s <= z[k]) { k--; s = ((f[q] + q * q) - (f[v[k]] + v[k] * v[k])) / (2 * q - 2 * v[k]); }
      k++; v[k] = q; z[k] = s; z[k + 1] = 1e30;
    }
    k = 0;
    for (let q = 0; q < len; q++) { while (z[k + 1] < q) k++; d[q] = (q - v[k]) * (q - v[k]) + f[v[k]]; }
  };
  for (let x = 0; x < w; x++) { for (let y = 0; y < h; y++) f[y] = m[y * w + x]; run(h); for (let y = 0; y < h; y++) m[y * w + x] = d[y]; }
  for (let y = 0; y < h; y++) { for (let x = 0; x < w; x++) f[x] = m[y * w + x]; run(w); for (let x = 0; x < w; x++) m[y * w + x] = d[x]; }
  const out = new Float32Array(w * h);
  for (let i = 0; i < out.length; i++) out[i] = Math.sqrt(m[i]) * metres;
  return out;
}
// smooth value noise (0..1) tied to places on the ground, with a fixed seed so nothing shimmers or moves between builds:
// a table of random values, and for each pixel along an axis its lattice cell, the next cell and the smoothed place inside the cell
function noiseTable(seed) {
  const t = new Float32Array(65536);
  for (let i = 0, s = seed; i < t.length; i++) {
    s = (s + 0x6D2B79F5) | 0;
    let r = Math.imul(s ^ (s >>> 15), 1 | s);
    r = (r + Math.imul(r ^ (r >>> 7), 61 | r)) ^ r;
    t[i] = ((r ^ (r >>> 14)) >>> 0) / 4294967296;
  }
  return t;
}
function noiseAxis(wavelength, n, origin, step, rowShift) {
  const cell = new Uint16Array(n), next = new Uint16Array(n), u = new Float32Array(n);
  for (let k = 0; k < n; k++) {
    const p = (origin + (k + 0.5) * step) / wavelength, f = Math.floor(p), w = p - f;
    cell[k] = (f & 255) << rowShift; next[k] = ((f + 1) & 255) << rowShift; u[k] = w * w * w * (w * (w * 6 - 15) + 10);
  }
  return { cell, next, u };
}

// the places, areas and paths that clear the fog
function fogInputs() {
  const places = PLACES.filter(p => !p.explore && !p.chain && !p.isArea && !p.noMarker).map(p => [p.lon, p.lat]);
  const areas = AREAS.filter(a => a.level !== "explore").map(a => a.polygon);
  const paths = ROUTES.map(r => r.path);
  return { places, areas, paths };
}

async function fogBuild() {
  const { places, areas, paths } = fogInputs();
  const sig = JSON.stringify([places, areas, paths]);
  if (sig === fogSig && map.getLayer("fog-img")) return fogShow(true);
  if (sig === fogBusy) return;
  fogBusy = sig;
  const mine = ++fogToken, pause = () => new Promise(r => setTimeout(r));
  // the canvas covers central Beijing, wider if the data reaches outside
  let [x0, y0, x1, y1] = FOG.box;
  const all = places.concat(areas.flat(), paths.flat());
  for (const [lo, la] of all) { x0 = Math.min(x0, lo - 0.05); x1 = Math.max(x1, lo + 0.05); y0 = Math.min(y0, la - 0.05); y1 = Math.max(y1, la + 0.05); }
  y0 = Math.max(y0, -80); y1 = Math.min(y1, 80);
  const rad = Math.PI / 180, merc = la => Math.log(Math.tan(Math.PI / 4 + la * rad / 2));
  const X0 = x0 * rad, X1 = x1 * rad, Y0 = merc(y0), Y1 = merc(y1);
  const W = FOG.width, H = Math.round(W * (Y1 - Y0) / (X1 - X0));
  const R = 6378137 * Math.cos(40 * rad), dx = (X1 - X0) / W, dy = (Y1 - Y0) / H, mpp = dx * R;     // ground metres per pixel
  const px = (lo, la) => [(lo * rad - X0) / dx, (Y1 - merc(la)) / dy];
  const [pc, po, pa] = FOG.place, [ac, ao, aa] = FOG.area, [rc, ro, ra] = FOG.path;

  // the window of the canvas that can be clear at all: around everything explored (everywhere else is plain fog)

  const ww = wx1 - wx0, wh = wy1 - wy0;

  // distance from the places, from the areas and from the paths, in metres, on a grid of half the canvas's size
  const S = 2, gw = Math.ceil(ww / S), gh = Math.ceil(wh / S);

        const da = dA ? dA[a] * w00 + dA[b] * w10 + dA[c] * w01 + dA[d] * w11 : far;
        const dr = dR ? dR[a] * w00 + dR[b] * w10 + dR[c] * w01 + dR[d] * w11 : far;

  }

  const cvs = document.createElement("canvas");
  cvs.width = W; cvs.height = H;
  cvs.getContext("2d").putImageData(img, 0, 0);
  // remove the old fog, lay the new one under my markers: the plain fill for everything outside the canvas, the canvas inside
  for (const id of ["fog-img", "fog-out"]) if (map.getLayer(id)) map.removeLayer(id);
  for (const id of ["fog-canvas", "fog-edge"]) if (map.getSource(id)) map.removeSource(id);
  const below = map.getLayer("routes") ? "routes" : undefined;
  map.addSource("fog-edge", { type: "geojson", maxzoom: 14, data: { type: "Feature", properties: {}, geometry: { type: "Polygon", coordinates: [
    [[-180, -85], [180, -85], [180, 85], [-180, 85], [-180, -85]], [[x0, y1], [x1, y1], [x1, y0], [x0, y0], [x0, y1]]] } } });
  map.addLayer({ id: "fog-out", type: "fill", source: "fog-edge", paint: {
    "fill-color": "rgb(" + FOG.rgb.join(",") + ")", "fill-opacity": Math.round(255 * FOG.alpha) / 255, "fill-antialias": false } }, below);
  map.addSource("fog-canvas", { type: "canvas", canvas: cvs, animate: false, coordinates: [[x0, y1], [x1, y1], [x1, y0], [x0, y0]] });
  map.addLayer({ id: "fog-img", type: "raster", source: "fog-canvas", paint: { "raster-resampling": "linear", "raster-fade-duration": 0, "raster-opacity": 1 } }, below);
  if (map.getLayer("temples-outer")) map.moveLayer("temples-outer", below);     // far-out temples stay findable in the fog
  fogSig = sig; fogBusy = "";
}
function fogShow(on) {

}

// blocks and sub-blocks (cut out of the road network), loaded when first asked for
let blocksReady = null;

    map.addSource("blocks", { type: "geojson", data: fc(
      d.sub.map(s => poly(s.p, { id: s.id, block: s.b, sub: true })).concat(d.blocks.map(b => poly(b.p, { id: b.id, block: b.id, sub: false })))) });

    map.addLayer({ id: "blocks-sub", type: "line", source: "blocks", filter: ["get", "sub"], paint: { "line-color": "#a3a29c", "line-width": 0.7 } }, "rings");

// [+]: add a point, a path, a region (both drawn point to point), a comment on a block, or just a note;
// each is saved to inbox/ in the data repository
let draft = null, pin = null, pts = [];
const HINT = { point: "Click the place on the map.", path: "Click along the path, then Done.",
               region: "Click each corner of the region, then Done.", block: "Click a block on the map.", note: "" };
const TITLE = { point: "New point", path: "New path", region: "New region", block: "Comment on a block", note: "Note or picture" };
function sketch() {
  const f = [];
  if (draft && draft.shape) f.push({ type: "Feature", properties: {}, geometry: draft.shape });
  else if (pts.length > 1) f.push({ type: "Feature", properties: {}, geometry: { type: "LineString", coordinates: mode === "region" && pts.length > 2 ? pts.concat([pts[0]]) : pts } });
  for (const p of pts) f.push({ type: "Feature", properties: {}, geometry: { type: "Point", coordinates: p } });
  map.getSource("sketch").setData(fc(f));
}
function bar(step) {   // step: "pick" (still choosing on the map) or "form"
  const drawing = step === "pick" && (mode === "path" || mode === "region");
  $("addForm").style.display = $("addSave").style.display = step === "form" ? "" : "none";
  $("addHint").style.display = step === "pick" ? "" : "none";
  $("addUndo").style.display = $("addDone").style.display = drawing ? "" : "none";
}
function begin(kind) {
  cancel();
  mode = kind; draft = { kind };
  $("addMenu").style.display = "none"; $("addBar").style.display = "block";
  $("addTitle").textContent = TITLE[kind]; $("addHint").textContent = HINT[kind]; $("addMsg").textContent = "";
  $("addText").value = ""; $("addPic").value = "";
  bar(kind === "note" ? "form" : "pick");
  if (innerWidth <= 700) setList(false);
  if (kind === "block") blocks(true);
  if (kind !== "note") map.getCanvas().style.cursor = "crosshair";
}
function cancel() {
  mode = null; draft = null; pts = [];
  $("addBar").style.display = "none";
  if (pin) { pin.remove(); pin = null; }
  if (ready) { sketch(); map.getCanvas().style.cursor = ""; }
}
function done() {
  const need = mode === "region" ? 3 : 2;
  if (pts.length < need) return void ($("addMsg").textContent = "Click at least " + need + " points.");
  if (mode === "region") { draft.polygon = pts.concat([pts[0]]); draft.shape = { type: "Polygon", coordinates: [draft.polygon] }; }
  else { draft.path = pts.slice(); draft.shape = { type: "LineString", coordinates: draft.path }; }
  pts = [];
  sketch();
  $("addMsg").textContent = "";
  map.getCanvas().style.cursor = "";

}
for (const b of $("addMenu").children) b.onclick = () => begin(b.dataset.kind);
$("addCancel").onclick = cancel;
$("addDone").onclick = done;
$("addUndo").onclick = () => { pts.pop(); sketch(); };
$("addSave").onclick = async () => {
  const text = $("addText").value.trim(), file = $("addPic").files[0];
  if (!text && !file) return void ($("addMsg").textContent = "Write something or choose a picture.");
  const stamp = new Date().toISOString().replace(/[:.]/g, "-"), name = "inbox/" + stamp + "-" + draft.kind;
  $("addMsg").textContent = "Saving...";
  try {
    const rec = Object.assign({ created: new Date().toISOString(), text }, draft);
    delete rec.shape;
    if (file) { rec.picture = name + ".jpg"; await put(rec.picture, await shrink(file)); }
    await put(name + ".json", b64text(JSON.stringify(rec, null, 1)));
    cancel();
  } catch (e) {
    $("addMsg").textContent = e === 403 || e === 404 ? "This token can only read. Adding needs a token with Contents: Read and write."
      : e === 401 ? "The token was not accepted." : "Could not save. Try again.";
  }
};

function click(e) {
  if (mode === "point") {
    draft.lon = +e.lngLat.lng.toFixed(6); draft.lat = +e.lngLat.lat.toFixed(6);
    if (pin) pin.remove();
    const el = document.createElement("div");
    el.className = "pin";
    pin = new maplibregl.Marker({ element: el }).setLngLat(e.lngLat).addTo(map);
    map.getCanvas().style.cursor = "";
    return bar("form");
  }
  if ((mode === "path" || mode === "region") && !draft.shape) {
    if (mode === "region" && pts.length > 2) {          // a click back on the first corner closes the region
      const first = map.project(pts[0]);
      if (Math.hypot(first.x - e.point.x, first.y - e.point.y) < 12) return done();
    }
    pts.push([+e.lngLat.lng.toFixed(6), +e.lngLat.lat.toFixed(6)]);
    return sketch();
  }
  if (mode === "block") {
    const hit = map.getLayer("blocks-fill") ? map.queryRenderedFeatures(e.point, { layers: ["blocks-fill"] }) : [];
    const f = hit.find(x => x.properties.sub) || hit[0];
    if (!f) return;
    draft.block = f.properties.block; draft.sub = f.properties.sub ? f.properties.id : null; draft.shape = f.geometry;
    sketch();
    return bar("form");
  }
  if (mode) return;
  const dot = map.queryRenderedFeatures(e.point, { layers: ["dots", "rings"] })[0];
  if (dot) return showPopup(byId[dot.properties.id]);
  const temple = map.queryRenderedFeatures(e.point, { layers: ["temples", "temples-outer"] })[0];
  if (temple) return showPopup(byId[temple.properties.id]);
  const named = map.queryRenderedFeatures(e.point, { layers: ["routes", "malls", "areas"] })[0];
  if (!named) return;
  const a = named.layer.id === "areas" ? AREAS[named.properties.i] : null;
  const KIND = { govt: "Government", traffic: "Traffic restrictions", stadium: "Stadium", hospital: "Hospital", quiet: "Quiet, not much there", ugly: "Ugly, nothing for me" };
  popup.setLngLat(e.lngLat).setHTML("<div class='pop'><b>" + esc(named.properties.name) + "</b>"
    + (a && KIND[a.kind] && KIND[a.kind] !== named.properties.name ? "<small>" + KIND[a.kind] + "</small>" : "")
    + (a && hoursLine(a) ? "<div>" + hoursLine(a) + "</div>" : "") + "</div>").addTo(map);
}

    // temples outside the 5th Ring stay a few pixels wide when zoomed out, so they can be found
    map.addLayer({ id: "temples-outer", type: "circle", source: "temples", filter: ["get", "outer"], paint: {
      "circle-radius": ["interpolate", ["exponential", 2], ["zoom"], 8, ["*", 4.5, ["+", 0.5, ["get", "k"]]], 11, ["*", 4.5, ["+", 0.5, ["get", "k"]]],
                        14, ["*", 25.6, ["get", "k"]], 20, ["*", 1640, ["get", "k"]]],
      "circle-color": ["case", ["get", "shut"], "#b8b7b2", "#9c4f96"],
      "circle-opacity": ["interpolate", ["linear"], ["zoom"], 9, 0.6, 13, 0.32] } }, under);
    map.addSource("places", empty());
    // chain branches: thin coloured ring, not filled; anything shut at the chosen time is grey
    map.addLayer({ id: "rings", type: "circle", source: "places", filter: ["get", "chain"], paint: {
      "circle-radius": ["interpolate", ["linear"], ["zoom"], 10, 3.5, 14, 6],
      "circle-color": "#ffffff", "circle-opacity": 0.55,
      "circle-stroke-color": ["case", ["get", "shut"], "#c4c3be", ["get", "color"]], "circle-stroke-width": 1.8,
    } });
    map.addLayer({ id: "dots", type: "circle", source: "places", filter: ["!", ["get", "chain"]], paint: {
      "circle-radius": ["interpolate", ["linear"], ["zoom"], 10, 5, 14, 7.5],
      "circle-color": ["case", ["get", "explore"], "#ffffff", ["get", "shut"], "#c4c3be", ["get", "color"]],
      "circle-opacity": ["case", ["get", "faint"], 0.4, 1],
      "circle-stroke-color": "#ffffff", "circle-stroke-width": 2,
    } });
    map.addLayer({ id: "labels", type: "symbol", source: "places", minzoom: 12, filter: ["!", ["get", "chain"]], layout: {   // names: unexplored and closed ones give way first
      "text-field": ["get", "name"], "text-font": ["Noto Sans Bold"], "text-size": ["interpolate", ["linear"], ["zoom"], 12, 10.5, 15, 12.5],
      "text-padding": 6, "symbol-sort-key": ["case", ["get", "explore"], 2, ["get", "shut"], 1, 0],
      "text-variable-anchor": ["left", "right", "top", "bottom"], "text-radial-offset": 0.9, "text-justify": "auto",
    }, paint: { "text-color": ["case", ["any", ["get", "shut"], ["get", "explore"]], "#a3a29c", "#2b2b2a"], "text-halo-color": "#ffffff", "text-halo-width": 1.6 } });
    map.addLayer({ id: "explore-q", type: "symbol", source: "places", filter: ["get", "explore"], layout: {
      "text-field": "?", "text-font": ["Noto Sans Bold"], "text-size": ["interpolate", ["linear"], ["zoom"], 10, 15, 14, 21],
      "text-allow-overlap": true, "text-ignore-placement": true },
      paint: { "text-color": ["case", ["get", "shut"], "#a3a29c", ["get", "color"]], "text-halo-color": "#ffffff", "text-halo-width": 2 } });
    map.addSource("sketch", empty());
    map.addLayer({ id: "sketch-fill", type: "fill", source: "sketch", filter: ["==", ["geometry-type"], "Polygon"], paint: { "fill-color": "#2b2b2a", "fill-opacity": 0.15 } });
    map.addLayer({ id: "sketch-line", type: "line", source: "sketch", filter: ["!=", ["geometry-type"], "Point"], paint: { "line-color": "#2b2b2a", "line-width": 2 } });
    map.addLayer({ id: "sketch-pts", type: "circle", source: "sketch", filter: ["==", ["geometry-type"], "Point"],
      paint: { "circle-radius": 4, "circle-color": "#fff", "circle-stroke-color": "#2b2b2a", "circle-stroke-width": 2 } });
    for (const id of ["dots", "rings"]) {
      map.on("mouseenter", id, () => { if (!mode) map.getCanvas().style.cursor = "pointer"; });
      map.on("mouseleave", id, () => { if (!mode) map.getCanvas().style.cursor = ""; });
    }
    ready = true;
    (function pulse(t) {   // events on now pulse slowly, like a recording light
      if (map.getLayer("glow")) map.setPaintProperty("glow", "circle-opacity", ["case", ["get", "live"], 0.6 + 0.35 * Math.sin(t * Math.PI / 1000), 0.5]);
      requestAnimationFrame(pulse);
    })(0);
    if (!$("mallsOn").classList.contains("on")) map.setLayoutProperty("malls", "visibility", "none");
    layers();
    render();
  });
}

start();
</script>
</body>
</html>
