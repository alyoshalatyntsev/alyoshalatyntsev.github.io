<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Map</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<link rel="stylesheet" href="leaflet/leaflet.css">
<style>
  html, body { height: 100%; margin: 0; font: 14px/1.4 "Segoe UI", system-ui, sans-serif; color: #222; }
  #app { display: flex; height: 100%; }
  #side { width: 280px; flex: none; overflow-y: auto; border-right: 1px solid #ddd; background: #fafaf8; }
  #map { flex: 1; }
  h1 { font-size: 16px; margin: 14px 14px 8px; }
  h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: #777; margin: 16px 14px 4px; }
  #filters { margin: 0 14px; display: flex; flex-wrap: wrap; gap: 4px 10px; }
  #filters label { cursor: pointer; white-space: nowrap; }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 5px; }
  .item { padding: 6px 14px; cursor: pointer; }
  .item:hover { background: #eeece6; }
  .item.unplaced { cursor: default; color: #555; }
  .item small { display: block; color: #777; }
  .item .q { color: #a04a00; }
  #forget { display: block; margin: 18px 14px; color: #999; font-size: 12px; }
  #coords { position: absolute; right: 10px; bottom: 22px; z-index: 1000; background: #fff; padding: 3px 8px;
            border: 1px solid #ccc; border-radius: 3px; font: 12px Consolas, monospace; user-select: all; }
  #toggle { display: none; position: absolute; top: 10px; right: 10px; z-index: 1100; padding: 7px 12px;
            background: #fff; border: 1px solid #bbb; border-radius: 4px; font: inherit; }
  .lbl { background: none; border: none; box-shadow: none; padding: 0; font: 600 12px "Segoe UI", sans-serif;
         color: #222; text-shadow: 0 0 3px #fff, 0 0 3px #fff, 0 0 3px #fff; }
  .lbl::before { display: none; }
  .far .lbl { display: none; }
  .leaflet-tile-pane { filter: saturate(.3) brightness(1.04); }
  #gate { position: fixed; inset: 0; z-index: 2000; background: #fafaf8; display: none;
          align-items: center; justify-content: center; }
  #gate form { width: min(340px, 86vw); }
  #gate input { width: 100%; box-sizing: border-box; padding: 8px; font: 14px Consolas, monospace; margin: 8px 0; }
  #gate button { padding: 7px 16px; font: inherit; }
  #gateMsg { color: #a04a00; min-height: 1.4em; margin-top: 8px; }
  @media (max-width: 700px) {
    #side { display: none; position: absolute; z-index: 1050; top: 0; bottom: 0; left: 0; width: min(300px, 85vw); }
    #app.list #side { display: block; }
    #toggle { display: block; }
    #coords { display: none; }
  }
</style>
</head>
<body>
<div id="gate">
  <form id="gateForm">
    <label for="token">GitHub token</label>
    <input id="token" type="password" autocomplete="off" spellcheck="false">
    <button>Open</button>
    <div id="gateMsg"></div>
  </form>
</div>
<div id="app">
  <div id="side">
    <h1>Beijing</h1>
    <div id="filters"></div>
    <h2>Places</h2>
    <div id="placed"></div>
    <h2 id="unplacedHead">Not placed yet</h2>
    <div id="unplaced"></div>
    <a id="forget" href="#">Forget token on this device</a>
  </div>
  <div id="map"></div>
</div>
<button id="toggle">List</button>
<div id="coords">click map for coordinates</div>

<script src="leaflet/leaflet.js"></script>
<script>
// The place data is not in this (public) site. It is read from a private GitHub
// repository with a token that the visitor types in once; the token stays in this browser.
const DATA = "https://api.github.com/repos/alyoshalatyntsev/beijing-map-data/contents/";
const $ = id => document.getElementById(id);

function askToken(msg) {
  $("gateMsg").textContent = msg || "";
  $("gate").style.display = "flex";
  $("token").focus();
}

async function load(token) {
  const get = async f => {
    const r = await fetch(DATA + f, { headers: { Authorization: "Bearer " + token, Accept: "application/vnd.github.raw+json" } });
    if (!r.ok) throw r.status;
    return r.json();
  };
  return Promise.all([get("places.json"), get("chains.json")]);
}

async function start() {
  const token = localStorage.getItem("mapToken");
  if (!token) return askToken();
  try {
    const [main, chains] = await load(token);
    $("gate").style.display = "none";
    draw(main.categories, main.places.concat(chains.places));
  } catch (e) {
    askToken(e === 401 ? "That token was not accepted." : e === 403 || e === 404 ? "That token cannot read the map data."
      : "Could not reach GitHub. Try again.");
  }
}

$("gateForm").onsubmit = e => {
  e.preventDefault();
  const t = $("token").value.trim();
  if (!t) return;
  localStorage.setItem("mapToken", t);
  $("gateMsg").textContent = "Loading...";
  start();
};
$("forget").onclick = e => { e.preventDefault(); localStorage.removeItem("mapToken"); location.reload(); };
$("toggle").onclick = () => $("app").classList.toggle("list");

function draw(CATEGORIES, PLACES) {
  const map = L.map("map", { zoomSnap: 0.5 }).setView([39.9420, 116.4030], 15.5);
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 19, attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
  }).addTo(map);
  L.control.scale({ imperial: false }).addTo(map);

  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const title = p => esc(p.name) + (p.name_zh ? " <small style='display:inline;color:#777'>" + esc(p.name_zh) + "</small>" : "");

  function popup(p) {
    let h = "<b>" + title(p) + "</b>";
    if (p.address) h += "<br>" + esc(p.address);
    if (p.located === "approx") h += "<br><i>approximate position</i>";
    if (p.notes) h += "<br>" + esc(p.notes);
    if (p.check) h += "<br><span style='color:#a04a00'>" + esc(p.check) + "</span>";
    return h;
  }

  const groups = {};
  for (const key in CATEGORIES) groups[key] = L.layerGroup().addTo(map);

  for (const p of PLACES) {
    const cat = CATEGORIES[p.category];
    const dot = "<span class='dot' style='background:" + cat.color + "'></span>";
    if (p.lat == null) {
      const d = document.createElement("div");
      d.className = "item unplaced";
      d.innerHTML = dot + title(p) + (p.notes ? "<small>" + esc(p.notes) + "</small>" : "")
        + (p.check ? "<small class='q'>" + esc(p.check) + "</small>" : "");
      $("unplaced").appendChild(d);
      continue;
    }
    const approx = p.located === "approx";
    const m = L.circleMarker([p.lat, p.lon], {
      radius: p.chain ? 4.5 : 7, color: approx ? cat.color : "#fff", weight: p.chain ? 1 : 2, dashArray: approx ? "3 3" : null,
      fillColor: cat.color, fillOpacity: approx ? 0.35 : 1,
    }).bindPopup(popup(p));
    if (p.chain) m.bindTooltip(p.name_zh || p.name, { direction: "right", offset: [6, 0] });
    else m.bindTooltip(p.name, { permanent: true, direction: "right", offset: [8, 0], className: "lbl" });
    m.addTo(groups[p.category]);
    if (p.chain) continue;

    const d = document.createElement("div");
    d.className = "item";
    d.dataset.cat = p.category;
    d.innerHTML = dot + title(p) + (p.address ? "<small>" + esc(p.address) + (approx ? " (approx.)" : "") + "</small>" : "");
    d.onclick = () => {
      $("app").classList.remove("list");
      map.setView([p.lat, p.lon], Math.max(map.getZoom(), 16.5));
      m.openPopup();
    };
    $("placed").appendChild(d);
  }

  for (const key in CATEGORIES) {
    const l = document.createElement("label");
    l.innerHTML = "<input type='checkbox' checked> <span class='dot' style='background:" + CATEGORIES[key].color + "'></span>" + CATEGORIES[key].label;
    l.firstChild.onchange = e => {
      e.target.checked ? groups[key].addTo(map) : groups[key].remove();
      document.querySelectorAll(".item[data-cat='" + key + "']").forEach(el => el.style.display = e.target.checked ? "" : "none");
    };
    $("filters").appendChild(l);
  }

  if (!$("unplaced").children.length) $("unplacedHead").style.display = "none";
  const showLabels = () => map.getContainer().classList.toggle("far", map.getZoom() < 14.5);
  map.on("zoomend", showLabels); showLabels();

  map.on("click", e => {
    $("coords").textContent = e.latlng.lat.toFixed(5) + ", " + e.latlng.lng.toFixed(5);
  });
}

start();
</script>
</body>
</html>
