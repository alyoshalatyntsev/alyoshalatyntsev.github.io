<!doctype html>
<html lang="en" data-version="20261009-5">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title> </title>
  <link rel="stylesheet" href="board.css?v=20261009-5">
</head>
<body>
  <div id="paper">
    <canvas id="grid" aria-hidden="true"></canvas>
    <canvas id="board" aria-label="Drawing surface"></canvas>
    <canvas id="overlay" aria-hidden="true"></canvas>
    <div id="text-edit" hidden>
      <textarea id="editor" aria-label="Text" maxlength="2000" spellcheck="false"></textarea>
      <div class="edit-edge" data-edge="t"></div><div class="edit-edge" data-edge="r"></div><div class="edit-edge" data-edge="b"></div><div class="edit-edge" data-edge="l"></div>
      <span class="text-handle" data-handle="tl"></span><span class="text-handle" data-handle="t"></span><span class="text-handle" data-handle="tr"></span><span class="text-handle" data-handle="l"></span><span class="text-handle" data-handle="r"></span><span class="text-handle" data-handle="bl"></span><span class="text-handle" data-handle="b"></span><span class="text-handle" data-handle="br"></span>
      <span class="text-handle scale-handle" data-handle="scale" aria-label="Scale text" title="Scale text">↘</span>
    </div>
  </div>
  <div id="toolbar" role="toolbar" aria-label="Tools">
    <button data-tool="select" aria-label="Select" aria-pressed="false" title="Select · V · middle-drag to lasso">
      <svg viewBox="0 0 22 24" aria-hidden="true"><path d="M6 3v14l3.6-3.4L12 19l2.2-1-2.4-5.2h4.7Z" fill="currentColor" stroke="none"/></svg>
    </button>
    <button data-tool="pen" aria-label="Pen" aria-pressed="true" title="Pen · P · hold for options">
      <svg viewBox="0 0 22 24" aria-hidden="true"><g transform="translate(11 10) rotate(45)"><path d="M-2.5-9h5V4L0 9l-2.5-5Z M-2.5 4h5"/></g><path class="ink" d="M4 21h14"/></svg>
    </button>
    <button data-tool="highlight" aria-label="Highlighter" aria-pressed="false" title="Highlighter · H · hold for options">
      <svg viewBox="0 0 22 24" aria-hidden="true"><g transform="translate(11 10) rotate(45)"><path d="M-4-9h8V1h-8Z M-3 1h6l-1 4h-4Z"/><path d="M-2 5h4v4l-4-1.5Z" fill="currentColor"/></g><path class="ink" d="M4 21h14"/></svg>
    </button>
    <button data-tool="text" aria-label="Text" aria-pressed="false" title="Text · T · hold for options">
      <svg viewBox="0 0 22 24" aria-hidden="true"><path d="M5 4h12M11 4v13M7.5 17h7M5 4v3M17 4v3" stroke-width="2"/><path class="ink" d="M4 21h14"/></svg>
    </button>
    <button data-tool="erase" aria-label="Eraser" aria-pressed="false" title="Eraser · E">
      <svg viewBox="0 0 22 24" aria-hidden="true"><g transform="translate(11 11) rotate(45)"><rect x="-4.5" y="-8" width="9" height="16" rx="1.5"/><path d="M-4.5 2h9v4.5a1.5 1.5 0 0 1-1.5 1.5h-6a1.5 1.5 0 0 1-1.5-1.5Z" fill="currentColor" stroke="none"/></g></svg>
    </button>
    <span class="tool-divider" aria-hidden="true"></span>
    <button id="export-pdf" aria-label="Export PDF" title="Export all drawings as PDF"><svg viewBox="0 0 22 24" aria-hidden="true"><path d="M5 3h8l4 4v5 M13 3v5h4 M4 17h14v4H4 M11 11v6 M8 14l3 3 3-3"/></svg></button>
    <span id="status" class="sr-only" role="status">Connecting</span>
  </div>
  <div id="options" role="dialog" aria-label="Tool options" hidden>
    <div id="colors" role="group" aria-label="Colour"></div>
    <label class="custom" title="Custom colour"><span>Custom colour</span><input id="custom-color" type="color" value="#111111" aria-label="Custom colour"></label>
    <label class="setting"><span id="width-label">Width</span><input id="width" type="range" min="1" max="80" value="4" aria-label="Width"><output id="width-value">4</output></label>
    <label class="setting">Opacity<input id="opacity" type="range" min="5" max="100" value="100" step="5" aria-label="Opacity"><output id="opacity-value">100%</output></label>
    <div id="selection-actions" hidden><span id="selection-count" class="sr-only"></span><button id="delete-selection">Delete</button><button id="deselect">Deselect</button></div>
  </div>
  <p id="message" role="status" hidden></p>
  <script>
    (async () => {
      const version = document.documentElement.dataset.version;
      const controller = new AbortController(), timeout = setTimeout(() => controller.abort(), 1500);
      try {
        const response = await fetch('release.json?check=' + Date.now(), { cache: 'no-store', signal: controller.signal });
        if (response.ok) {
          const latest = (await response.json()).version;
          if (/^\d{8}-\d+$/.test(latest)) {
            const [date, build] = version.split('-').map(Number), [nextDate, nextBuild] = latest.split('-').map(Number);
            const url = new URL(location.href);
            if ((nextDate > date || nextDate === date && nextBuild > build) && url.searchParams.get('v') !== latest) {
              url.searchParams.set('v', latest);
              location.replace(url.href); // Keep this board's sharing ID and drawings.
              return;
            }
          }
        }
      } catch {} finally { clearTimeout(timeout); }
      const load = file => new Promise((resolve, reject) => {
        const script = document.createElement('script'); script.src = file + '?v=' + version;
        script.onload = resolve; script.onerror = () => reject(new Error('Could not load the whiteboard. Reload to try again.'));
        document.body.append(script);
      });
      try {
        await Promise.all(['ink.js', 'text.js', 'files.js', 'expiry.js'].map(load));
        await load('board.js');
      } catch (error) {
        const message = document.getElementById('message'); message.textContent = error.message; message.hidden = false;
      }
    })();
  </script>
</body>
</html>
