<!doctype html>
<html lang="en" data-version="20261009-18">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title> </title>
  <link rel="stylesheet" href="board.css?v=e200438b571af40f">
</head>
<body>
  <div id="paper">
    <canvas id="grid" aria-hidden="true"></canvas>
    <canvas id="board" aria-label="Drawing surface"></canvas>
    <canvas id="overlay" aria-hidden="true"></canvas>
    <div id="text-edit" hidden>
      <textarea id="editor" aria-label="Text" maxlength="2000" spellcheck="false"></textarea>
      <div class="edit-edge" data-edge="t"></div><div class="edit-edge" data-edge="r"></div><div class="edit-edge" data-edge="b"></div><div class="edit-edge" data-edge="l"></div>
      <span class="text-handle" data-handle="tl"></span><span class="text-handle" data-handle="t"></span><span class="text-handle" data-handle="tr"></span><span class="text-handle" data-handle="l"></span><span class="text-handle" data-handle="r"></span><span class="text-handle" data-handle="bl"></span><span class="text-handle" data-handle="b"></span><span class="text-handle" data-handle="br"></span>
      <span class="text-handle scale-handle" data-handle="scale" aria-label="Scale text" title="Scale text">↘</span>
    </div>
    <div id="collaborators" aria-label="Collaborator cursors" aria-live="off"></div>
  </div>
  <div id="text-format" role="toolbar" aria-label="Text formatting" hidden>
    <select id="text-font" aria-label="Font" title="Font"><option value="sans">Sans</option><option value="serif">Serif</option><option value="mono">Mono</option></select>
    <input id="text-size" type="number" min="4" max="2048" step="1" aria-label="Font size" title="Font size">
    <input id="text-color" type="color" aria-label="Text colour" title="Text colour">
    <span class="text-format-divider" aria-hidden="true"></span>
    <button type="button" data-text-style="bold" aria-label="Bold" aria-pressed="false" title="Bold"><strong>B</strong></button>
    <button type="button" data-text-style="italic" aria-label="Italic" aria-pressed="false" title="Italic"><em>I</em></button>
    <button type="button" data-text-style="underline" aria-label="Underline" aria-pressed="false" title="Underline"><u>U</u></button>
    <button type="button" data-text-style="strike" aria-label="Strikethrough" aria-pressed="false" title="Strikethrough"><s>S</s></button>
    <span class="text-format-divider" aria-hidden="true"></span>
    <select id="text-align" aria-label="Text alignment" title="Text alignment"><option value="left">Left</option><option value="center">Centre</option><option value="right">Right</option></select>
  </div>
  <div id="connection-overlay" role="status">Connecting…</div>
  <button id="reset-view" type="button" hidden>Reset view</button>
  <div id="toolbar" role="toolbar" aria-label="Tools">
    <button data-tool="hand" aria-label="Hand" aria-pressed="false" title="Hand · G · drag to move the board">
      <svg viewBox="0 0 22 24" aria-hidden="true"><path d="M6 12V6a1.5 1.5 0 0 1 3 0v5-7a1.5 1.5 0 0 1 3 0v7-6a1.5 1.5 0 0 1 3 0v7-4a1.5 1.5 0 0 1 3 0v7c0 4-2 7-6 7h-1c-2 0-3-1-4-3l-3-5c-1-2 1-3 2-2l3 3"/></svg>
    </button>
    <button data-tool="select" aria-label="Select" aria-pressed="false" title="Select · V · drag a box; middle-drag to pan">
      <svg viewBox="0 0 22 24" aria-hidden="true"><path d="M6 3v14l3.6-3.4L12 19l2.2-1-2.4-5.2h4.7Z" fill="currentColor" stroke="none"/></svg>
    </button>
    <button data-tool="lasso" aria-label="Freehand select" aria-pressed="false" title="Freehand select · L · draw a loop">
      <svg viewBox="0 0 22 24" aria-hidden="true"><path d="M5.5 6.5c-3 3-3 9 1 11 3 2 9 2 11-2 2-4 0-9-4-10-3-1-6-1-8 1Z" stroke-dasharray="1.2 2.6" stroke-width="1.8"/><path d="M15.5 2.5v6M12.5 5.5h6" stroke-width="1.6"/></svg>
    </button>
    <button data-tool="pen" aria-label="Pen" aria-pressed="true" title="Pen · P · hold for options">
      <svg viewBox="0 0 22 24" aria-hidden="true"><g transform="translate(11 10) rotate(45)"><path d="M-2.5-9h5V4L0 9l-2.5-5Z M-2.5 4h5"/></g><path class="ink" d="M4 21h14"/></svg>
    </button>
    <button data-tool="highlight" aria-label="Highlighter" aria-pressed="false" title="Highlighter · H · hold for options">
      <svg viewBox="0 0 22 24" aria-hidden="true"><g transform="translate(11 10) rotate(45)"><path d="M-4-9h8V1h-8Z M-3 1h6l-1 4h-4Z"/><path d="M-2 5h4v4l-4-1.5Z" fill="currentColor"/></g><path class="ink" d="M4 21h14"/></svg>
    </button>
    <button data-tool="text" aria-label="Text" aria-pressed="false" title="Text · T · hold for options">
      <svg viewBox="0 0 22 24" aria-hidden="true"><path d="M5 4h12M11 4v13M7.5 17h7M5 4v3M17 4v3" stroke-width="2"/><path class="ink" d="M4 21h14"/></svg>
    </button>
    <button data-tool="erase" aria-label="Eraser" aria-pressed="false" title="Eraser · E · hold for size">
      <svg viewBox="0 0 22 24" aria-hidden="true"><g transform="translate(11 11) rotate(45)"><rect x="-4.5" y="-8" width="9" height="16" rx="1.5"/><path d="M-4.5 2h9v4.5a1.5 1.5 0 0 1-1.5 1.5h-6a1.5 1.5 0 0 1-1.5-1.5Z" fill="currentColor" stroke="none"/></g></svg>
    </button>
    <span class="tool-divider" aria-hidden="true"></span>
    <button id="export-pdf" aria-label="Export PDF" title="Export PDF · choose a folder"><svg viewBox="0 0 22 24" aria-hidden="true"><path d="M5 3h8l4 4v5 M13 3v5h4 M4 17h14v4H4 M11 11v6 M8 14l3 3 3-3"/></svg></button>
    <button id="new-board" aria-label="New board" title="New board · keep this board and start another"><svg viewBox="0 0 22 24" aria-hidden="true"><path d="M11 5v14M4 12h14" stroke-width="2"/></svg></button>
    <span id="status" class="sr-only" role="status">Connecting</span>
  </div>
  <div id="tool-tooltip" role="tooltip" hidden></div>
  <div id="options" role="dialog" aria-label="Tool options" hidden>
    <div id="colors" role="group" aria-label="Colour"></div>
    <label id="custom-row" class="custom" title="Custom colour"><span>Custom colour</span><input id="custom-color" type="color" value="#111111" aria-label="Custom colour"></label>
    <label class="setting"><span id="width-label">Width</span><input id="width" type="range" min="0" max="15" step="1" value="5" aria-label="Width" title="Drag to change width in steps"><input id="width-value" class="setting-value" type="text" value="3" inputmode="decimal" aria-label="Exact width" readonly title="Click to type a width"></label>
    <label id="opacity-row" class="setting">Opacity<input id="opacity" type="range" min="0" max="100" value="100" step="10" aria-label="Opacity" title="Drag to change opacity in 10% steps"><input id="opacity-value" class="setting-value" type="text" value="100%" inputmode="decimal" aria-label="Exact opacity" readonly title="Click to type an opacity"></label>
    <div id="selection-actions" hidden><span id="selection-count" class="sr-only"></span><button id="delete-selection" title="Delete selected objects">Delete</button><button id="deselect" title="Clear the selection">Deselect</button></div>
  </div>
  <p id="message" role="status" hidden></p>
  <script>
    (async () => {
      const version = document.documentElement.dataset.version;
      let assets = /* ASSET_FINGERPRINTS */ {"board.css":"e200438b571af40f","ink.js":"720d1b271c39c2b5","text.js":"98f8792550550617","files.js":"8e8b933e645c61e1","expiry.js":"51b113a9df9e1f1e","board.js":"7b0c180c0be33b57"};
      const controller = new AbortController(), timeout = setTimeout(() => controller.abort(), 1500);
      try {
        const response = await fetch('release.json?check=' + Date.now(), { cache: 'no-store', signal: controller.signal });
        if (response.ok) {
          const release = await response.json(), latest = release.version;
          if (latest === version && release.assets && typeof release.assets === 'object') assets = release.assets;
          if (/^\d{8}-\d+$/.test(latest)) {
            const [date, build] = version.split('-').map(Number), [nextDate, nextBuild] = latest.split('-').map(Number);
            const url = new URL(location.href);
            if ((nextDate > date || nextDate === date && nextBuild > build) && url.searchParams.get('v') !== latest) {
              url.searchParams.set('v', latest);
              location.replace(url.href); // Keep this board's sharing ID and drawings.
              return;
            }
          }
        }
      } catch {} finally { clearTimeout(timeout); }
      const fingerprint = file => /^[a-f0-9]{16}$/.test(assets[file]) ? assets[file] : version;
      const css = document.querySelector('link[rel=stylesheet]'), stylesheet = 'board.css?v=' + fingerprint('board.css');
      if (css.getAttribute('href') !== stylesheet) css.setAttribute('href', stylesheet);
      const load = file => new Promise((resolve, reject) => {
        const script = document.createElement('script'); script.src = file + '?v=' + fingerprint(file);
        script.onload = resolve; script.onerror = () => reject(new Error('Could not load the whiteboard. Reload to try again.'));
        document.body.append(script);
      });
      try {
        await Promise.all(['ink.js', 'text.js', 'files.js', 'expiry.js'].map(load));
        await load('board.js');
      } catch (error) {
        const message = document.getElementById('message'); message.textContent = error.message; message.hidden = false;
      }
    })();
  </script>
</body>
</html>
